name: Last.app isolated ingestion
on:
  push:
    branches: [rebuild/staging-first]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  isolated-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: lastapp_isolation_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: lastapp_isolation_test
      PGUSER: postgres
      PGPASSWORD: synthetic_ci_only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check preserved legacy integration
        run: python3 scripts/verify_lastapp_preservation.py
      - name: Node contract and simulated worker tests
        run: node --test integrations/lastapp/isolation/tests/contract.test.mjs
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then sudo apt-get update && sudo apt-get install -y postgresql-client; fi
      - name: Prepare disposable roles and standalone schema
        run: |
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;'
          psql -X -v ON_ERROR_STOP=1 -c "SET ed_last_stage.bootstrap='ISOLATED_TEST_DATABASE';" -f integrations/lastapp/isolation/schema.sql
      - name: Database behavior and permission tests
        run: psql -X -v ON_ERROR_STOP=1 -f integrations/lastapp/isolation/tests/database.sql
      - name: Real concurrent PostgreSQL sessions
        run: bash integrations/lastapp/isolation/tests/concurrency.sh
