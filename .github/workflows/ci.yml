name: Check Estambul Delivery
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  demo-and-project:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser demos
        run: |
          node --check docs/demo.js
          node --check docs/live.js
          node --check docs/rider.js
          node --check docs/track.js
          node --check rider-sw.js
          node -e "JSON.parse(require('fs').readFileSync('rider.webmanifest'))"
          node --check docs/live-config.js
          node --check docs/sw.js
          node -e "JSON.parse(require('fs').readFileSync('docs/manifest.webmanifest'))"
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck back office
        run: npm run typecheck:backoffice
      - name: Typecheck native rider
        run: npm run typecheck:rider
      - name: Build back office
        run: npm run build:backoffice
