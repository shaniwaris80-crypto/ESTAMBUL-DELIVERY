name: Last.app preservation

on:
  push:
    branches: [rebuild/staging-first]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test the offline integrity checker
        run: python3 -m unittest discover -s tests -v
      - name: Verify preserved Last.app sources and SQL history
        run: python3 scripts/verify_lastapp_preservation.py
