name: WhatsApp template and one-link safety
on:
  push:
    branches: [feature/whatsapp-tracking-twilio-template-20261018]
  pull_request:
    paths:
      - 'supabase/functions/ed-rider-accept-sms/index.ts'
      - 'docs/staging/one-tracking-message-sms-whatsapp-review.sql'
      - 'docs/rider.js'
      - 'scripts/twilio-whatsapp-template.mjs'
      - 'scripts/test-whatsapp-one-link.mjs'
permissions:
  contents: read
jobs:
  whatsapp-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check docs/rider.js
          node --check scripts/twilio-whatsapp-template.mjs
          node --check scripts/test-whatsapp-one-link.mjs
      - run: node --test scripts/test-whatsapp-one-link.mjs
      - run: node --test scripts/test-one-sms-waiting-pro.mjs
      - run: node --test scripts/test-preview-parity.mjs
