name: Rider PRO profile safety checks
on:
  push:
    branches:
      - feature/rider-pro-five-profiles-20261018
  pull_request:
    paths:
      - rider.html
      - docs/rider.js
      - docs/rider-profiles.js
      - docs/rider-pro-v3.css
      - apps/rider/app/connected.tsx
      - apps/rider/lib/rider-profiles.ts
      - scripts/test-rider-profiles.mjs
permissions:
  contents: read
jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript
        run: |
          node --check docs/rider.js
          node --check docs/rider-profiles.js
          node --check scripts/test-rider-profiles.mjs
      - name: Verify Rider profile safety
        run: node --test scripts/test-rider-profiles.mjs
