name: Estambul Visual PRO V5 real UI
on:
  push:
    branches:
      - feature/visual-pro-v5-dark-scooter-20261018
  pull_request:
    paths:
      - 'live.html'
      - 'rider.html'
      - 'track.html'
      - 'docs/visual-*.css'
      - 'docs/visual-*.js'
      - 'docs/icon.svg'
      - 'docs/live.js'
      - 'rider.webmanifest'
      - 'rider-sw.js'
      - 'scripts/test-visual-v5.mjs'
permissions:
  contents: read
jobs:
  real-ui-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate real UI code
        run: |
          node --check docs/live.js
          node --check docs/rider.js
          node --check docs/visual-ops-map-v5.js
          node --check scripts/test-visual-v5.mjs
      - name: Real V5 UX and operational safety
        run: node --test scripts/test-visual-v5.mjs
      - name: Production vs preview parity
        run: node --test scripts/test-preview-parity.mjs
